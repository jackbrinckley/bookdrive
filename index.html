<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Drive Counter</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --accent-color: #0066cc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-corner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .login-corner:hover {
            transform: scale(1.05);
        }

        .main-container {
            max-width: 900px;
            margin: 60px auto;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .counter-box {
            font-size: 6rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
            transition: transform 0.2s;
        }

        .counter-box.bump {
            transform: scale(1.15);
        }

        .leaderboards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .board {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 40%;
            min-width: 280px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }

        .board h3 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .board ul {
            padding-left: 20px;
        }

        .admin-panel {
            display: none;
            background: var(--card-bg);
            margin-top: 40px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }

        .admin-panel input {
            padding: 8px;
            margin: 5px 0;
            width: 200px;
        }

        .admin-panel button {
            padding: 8px 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .admin-panel button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="login-corner" onclick="teamLogin()">Team Login</div>

    <div class="main-container">
        <h1>Total Books Donated</h1>
        <div class="counter-box" id="totalCount">0</div>

        <div class="leaderboards">
            <div class="board">
                <h3>Top Donors (Individual)</h3>
                <ul id="donorList"><li>No donations yet</li></ul>
            </div>
            <div class="board">
                <h3>Top Years (Grade/Year)</h3>
                <ul id="yearList"><li>No donations yet</li></ul>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h3>Team Management Tools</h3>

            <button onclick="adjustTotal(1)">+ Add Book</button>
            <button onclick="adjustTotal(-1)">- Subtract Book</button>

            <hr>

            <h4>Log New Book Donation</h4>
            <input type="text" id="donorName" placeholder="Donor Name">
            <input type="text" id="donorYear" placeholder="Year (e.g. Year 10)">
            <button onclick="addDonationRecord()">Submit Record</button>

            <hr>

            <h4>Customize Style</h4>
            <label>Background: <input type="color" id="bgColorPicker" onchange="changeBgColor()"></label>
            <label>Text: <input type="color" id="textColorPicker" onchange="changeTextColor()"></label>
        </div>
    </div>

    <script>
        let totalBooks = 0;
        let donors = {};
        let years = {};

        function teamLogin() {
            const pwd = prompt("Enter password:");
            if (pwd === "8542") {
                document.getElementById('adminPanel').style.display = 'block';
                alert("Logged in!");
            } else if (pwd !== null) {
                alert("Incorrect password.");
            }
        }

        function adjustTotal(amount) {
            totalBooks = Math.max(0, totalBooks + amount);
            const counter = document.getElementById('totalCount');
            counter.innerText = totalBooks;

            counter.classList.add("bump");
            setTimeout(() => counter.classList.remove("bump"), 200);
        }

        function addDonationRecord() {
            const name = document.getElementById('donorName').value.trim();
            const year = document.getElementById('donorYear').value.trim();

            if (!name || !year) {
                alert("Please enter both name and year.");
                return;
            }

            donors[name] = (donors[name] || 0) + 1;
            years[year] = (years[year] || 0) + 1;

            adjustTotal(1);
            updateLeaderboards();

            document.getElementById('donorName').value = '';
            document.getElementById('donorYear').value = '';
        }

        function updateLeaderboards() {
            const donorUl = document.getElementById('donorList');
            const yearUl = document.getElementById('yearList');

            donorUl.innerHTML = '';
            yearUl.innerHTML = '';

            const sortedDonors = Object.entries(donors).sort((a, b) => b[1] - a[1]);
            const sortedYears = Object.entries(years).sort((a, b) => b[1] - a[1]);

            donorUl.innerHTML = sortedDonors.length
                ? sortedDonors.map(([n, c]) => `<li>${n}: ${c} books</li>`).join('')
                : '<li>No donations yet</li>';

            yearUl.innerHTML = sortedYears.length
                ? sortedYears.map(([y, c]) => `<li>${y}: ${c} books</li>`).join('')
                : '<li>No donations yet</li>';
        }

        function changeBgColor() {
            document.documentElement.style.setProperty('--bg-color',
                document.getElementById('bgColorPicker').value);
        }

        function changeTextColor() {
            document.documentElement.style.setProperty('--text-color',
                document.getElementById('textColorPicker').value);
        }
    </script>
</body>
</html>
