<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Drive Counter</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --accent-color: #0066cc;
            --accent-glow: rgba(0, 102, 204, 0.2);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-corner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .main-container {
            max-width: 900px;
            margin: 50px auto;
            text-align: center;
        }

        /* Bold & Interesting Typography for the Main Titles */
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.05);
        }

        /* Transformed Counter Box */
        .counter-box {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            color: var(--accent-color);
            margin: 10px 0 30px 0;
            letter-spacing: -2px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.05),
                         0px 0px 30px var(--accent-glow);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .leaderboards {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-top: 40px;
        }

        /* Bold Style Updates to Leaderboards */
        .board {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 40%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: left;
        }

        .board h3 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .board ul {
            padding-left: 0;
            list-style: none;
        }

        .board li {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.02);
            border-left: 4px solid var(--accent-color);
            border-radius: 0 6px 6px 0;
        }

        .admin-panel {
            display: none;
            background: var(--card-bg);
            margin-top: 40px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }

        .admin-panel input, .admin-panel select {
            padding: 8px;
            margin: 5px;
            font-size: 14px;
        }

        .admin-panel button {
            padding: 8px 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="login-corner" onclick="teamLogin()">Part of the team? Log in now.</div>

    <div class="main-container">
        <h1>Total Books Donated</h1>
        <div class="counter-box" id="totalCount">0</div>

        <div class="leaderboards">
            <div class="board">
                <h3>Top Donors (Individual)</h3>
                <ul id="donorList"><li>No donations yet</li></ul>
            </div>
            <div class="board">
                <h3>Top Years (Grade/Year)</h3>
                <ul id="yearList"><li>No donations yet</li></ul>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h3>Team Management Tools</h3>
            <div>
                <button onclick="adjustTotal(1)">+ Add Book</button>
                <button onclick="adjustTotal(-1)">- Subtract Book</button>
            </div>
            <hr style="margin: 15px 0;">
            <h4>Log New Book Donation</h4>
            <input type="text" id="donorName" placeholder="Donor Name">
            <input type="text" id="donorYear" placeholder="Year (e.g. Year 10)">
            <button onclick="addDonationRecord()">Submit Record</button>
            <hr style="margin: 15px 0;">
            <h4>Customize Style</h4>
            <label>Background Color: <input type="color" id="bgColorPicker" onchange="changeBgColor()"></label>
            <label>Text Color: <input type="color" id="textColorPicker" onchange="changeTextColor()"></label>
        </div>
    </div>

    <script>
        let totalBooks = 0;
        let donors = {};
        let years = {};

        function teamLogin() {
            let pwd = prompt("Enter password:");
            if (pwd === "8542") {
                document.getElementById('adminPanel').style.display = 'block';
                alert("Logged in successfully!");
            } else if (pwd !== null) {
                alert("Incorrect password.");
            }
        }

        function adjustTotal(amount) {
            totalBooks = Math.max(0, totalBooks + amount);
            document.getElementById('totalCount').innerText = totalBooks;
        }

        function addDonationRecord() {
            let name = document.getElementById('donorName').value.trim();
            let year = document.getElementById('donorYear').value.trim();

            if (!name || !year) {
                alert("Please enter both name and year.");
                return;
            }

            donors[name] = (donors[name] || 0) + 1;
            years[year] = (years[year] || 0) + 1;

            adjustTotal(1);
            updateLeaderboards();

            document.getElementById('donorName').value = '';
            document.getElementById('donorYear').value = '';
        }

        function updateLeaderboards() {
            let donorUl = document.getElementById('donorList');
            let yearUl = document.getElementById('yearList');

            donorUl.innerHTML = '';
            yearUl.innerHTML = '';

            let sortedDonors = Object.entries(donors).sort((a, b) => b[1] - a[1]);
            let sortedYears = Object.entries(years).sort((a, b) => b[1] - a[1]);

            if (sortedDonors.length === 0) {
                donorUl.innerHTML = '<li>No donations yet</li>';
            } else {
                sortedDonors.forEach(([name, count]) => {
                    let li = document.createElement('li');
                    li.innerText = `${name}: ${count} books`;
                    donorUl.appendChild(li);
                });
            }

            if (sortedYears.length === 0) {
                yearUl.innerHTML = '<li>No donations yet</li>';
            } else {
                sortedYears.forEach(([yr, count]) => {
                    let li = document.createElement('li');
                    li.innerText = `${yr}: ${count} books`;
                    yearUl.appendChild(li);
                });
            }
        }

        function changeBgColor() {
            let color = document.getElementById('bgColorPicker').value;
            document.documentElement.style.setProperty('--bg-color', color);
        }

        function changeTextColor() {
            let color = document.getElementById('textColorPicker').value;
            document.documentElement.style.setProperty('--text-color', color);
        }
    </script>
</body>
</html>
